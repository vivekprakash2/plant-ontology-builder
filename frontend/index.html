<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AskEllie</title>
<link rel="icon" type="image/png" href="/logo.png">
<script>
  // Applied before the stylesheet renders anything, so there's no flash of
  // the wrong theme. Dark mode is the default when no preference is saved.
  (function () {
    var saved = localStorage.getItem("theme");
    document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
  })();
</script>
<link
  href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="backdrop-grid" aria-hidden="true"></div>
  <div class="backdrop-glow" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="app-header">
      <div class="brand-block">
        <img class="brand-logo" src="/logo.png" alt="AskEllie">
        <div>
          <p class="eyebrow">Hindenberg Refinery</p>
          <h1>AskEllie</h1>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to light mode">☀️</button>
      </div>
    </header>

    <section class="workspace" id="workspace">
      <section class="chat-panel" id="chatPanel">
        <div class="chat-thread" id="chatThread"></div>

        <div class="composer">
          <div class="suggestion-row" id="suggestionRow"></div>
          <div class="composer-input">
            <textarea
              id="customQuestion"
              placeholder="Ask Ellie anything about the plant -- e.g. 'Show me everything happening on Unit 100' or 'What's alarming right now?'"
              rows="1"
            ></textarea>
            <button id="runButton" class="primary-btn" type="button">Ask</button>
          </div>
        </div>
      </section>

      <!-- Drag to resize the chat/graph split; click the handle to fully
           collapse the graph panel to the right edge (reopen via the same
           handle, which becomes a slim tab). -->
      <div class="panel-splitter" id="panelSplitter">
        <button class="collapse-toggle" id="collapseToggle" type="button" aria-label="Collapse graph panel" title="Collapse graph panel">›</button>
      </div>

      <aside class="explorer-panel" id="explorerPanel">
        <div class="explorer-header">
          <div class="explorer-tabs">
            <button class="explorer-tab" id="tabOverview" type="button">Ontology Overview</button>
            <button class="explorer-tab active" id="tabWalk" type="button">Reasoning Walk</button>
          </div>
          <p class="muted" id="explorerHint">Browse the unified knowledge graph directly, or ask a question to see it come alive.</p>
        </div>
        <div class="explorer-controls" id="explorerControls">
          <div class="focus-group" id="graphFilterGroup"></div>
        </div>

        <div class="graph-viewport" id="graphViewport">
          <div id="viewOverview" class="graph-view"></div>
          <div id="viewWalk" class="graph-view active">
            <svg id="plantGraph" class="relationship-graph"></svg>
          </div>

          <div class="zoom-stack" id="zoomStack">
            <button id="zoomInBtn" class="zoom-btn" type="button" aria-label="Zoom in">+</button>
            <button id="zoomResetBtn" class="zoom-btn" type="button" aria-label="Reset zoom">100%</button>
            <button id="zoomOutBtn" class="zoom-btn" type="button" aria-label="Zoom out">-</button>
          </div>

          <!-- Live during an active question (populated from the same SSE
               tool-call events as the chat's own trace); also replayable
               afterwards via play/step/reset, reusing the same
               build_graph_walk() steps that drive the auto highlight. -->
          <div class="reasoning-trace" id="reasoningTrace">
            <div class="log-head">
              <span class="dot"></span>Reasoning trace
              <div class="spacer"></div>
              <button class="log-btn" id="tracePlayBtn" type="button" aria-label="Play walk" data-tip="Play walk">▶</button>
              <button class="log-btn" id="traceStepBtn" type="button" aria-label="Next step" data-tip="Next step">⏭</button>
              <button class="log-btn" id="traceResetBtn" type="button" aria-label="Reset walk" data-tip="Reset walk">↺</button>
            </div>
            <div class="log-body" id="traceLogBody"></div>
          </div>

          <div class="graph-legend" id="graphLegend">
            <span class="legend-item"><i class="legend-swatch" style="background:#f9c74f"></i>Asset</span>
            <span class="legend-item"><i class="legend-swatch" style="background:#f94144"></i>Alarm</span>
            <span class="legend-item"><i class="legend-swatch" style="background:#577590"></i>Work Order</span>
            <span class="legend-item"><i class="legend-swatch" style="background:#f8961e"></i>Operator Action</span>
            <span class="legend-item"><i class="legend-swatch" style="background:#9b5de5"></i>Health Event</span>
            <span class="legend-item"><i class="legend-swatch" style="background:#43aa8b"></i>Cost Posting</span>
            <span class="legend-item"><i class="legend-swatch" style="background:#adb5bd"></i>Historian Tag</span>
            <span class="legend-item"><i class="legend-line" style="background:var(--accent-blue)"></i>walk in progress</span>
            <span class="legend-item"><i class="legend-line" style="background:var(--accent-red)"></i>settled answer</span>
          </div>

          <div class="inspector" id="inspector"></div>
        </div>
      </aside>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>

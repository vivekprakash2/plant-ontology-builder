<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AskEllie</title>
<link rel="icon" type="image/png" href="/logo.png">
<script>
  // Applied before the stylesheet renders anything, so there's no flash of
  // the wrong theme. Light mode is the default when no preference is saved.
  (function () {
    var saved = localStorage.getItem("theme");
    document.documentElement.setAttribute("data-theme", saved === "dark" ? "dark" : "light");
  })();
</script>
<link
  href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <!-- Doubles as a "back to start" home button (see resetToStart()). -->
      <div class="brand-home" id="brandHome" role="button" tabindex="0" title="Back to start">
        <img class="brand-logo" src="/logo.png" alt="AskEllie">
        <h1>AskEllie</h1>
      </div>
      <div class="spacer"></div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to light mode">☀️</button>
    </header>

    <section class="workspace" id="workspace">
      <section class="chat-panel" id="chatPanel">
        <div class="chat-head" id="chatHead">Chat with Ellie</div>
        <div class="chat-thread" id="chatThread"></div>

        <div class="composer">
          <div class="composer-input">
            <textarea
              id="customQuestion"
              placeholder="Ask Ellie about the plant…"
              rows="1"
            ></textarea>
            <button id="runButton" class="primary-btn" type="button">Ask</button>
          </div>
        </div>
      </section>

      <!-- Drag to resize the chat/graph split; click the handle to fully
           collapse the graph panel to the right edge (reopen via the same
           handle, which becomes a slim tab). -->
      <div class="panel-splitter" id="panelSplitter">
        <button class="collapse-toggle" id="collapseToggle" type="button" aria-label="Collapse graph panel" title="Collapse graph panel">›</button>
      </div>

      <aside class="explorer-panel" id="explorerPanel">
        <div class="explorer-header">
          <div class="explorer-tabs">
            <button class="explorer-tab active" id="tabOverview" type="button">Ontology Overview</button>
            <button class="explorer-tab" id="tabWalk" type="button">Reasoning Walk</button>
          </div>
          <div class="spacer"></div>
          <p class="explorer-counter" id="explorerHint"></p>
        </div>
        <div class="graph-viewport" id="graphViewport">
          <div id="viewOverview" class="graph-view active"></div>
          <div id="viewWalk" class="graph-view">
            <svg id="plantGraph" class="relationship-graph"></svg>
          </div>

          <!-- Empty-state hint shown on the Reasoning Walk tab until a
               question has actually been asked -- the walk view only ever
               shows the subgraph scoped to an answer, never the whole plant. -->
          <div class="graph-empty-hint" id="walkEmptyHint">
            <p><strong>No reasoning walk yet</strong></p>
            <p>Ask Ellie a question and watch her walk the plant's knowledge graph, step by step, right here.</p>
          </div>

          <div class="zoom-stack" id="zoomStack">
            <button id="zoomInBtn" class="zoom-btn" type="button" aria-label="Zoom in" data-tip="Zoom in">+</button>
            <button id="zoomResetBtn" class="zoom-btn" type="button" aria-label="Fit to view" data-tip="Fit to view">⤢</button>
            <button id="zoomOutBtn" class="zoom-btn" type="button" aria-label="Zoom out" data-tip="Zoom out">−</button>
          </div>

          <div class="edge-tooltip" id="edgeTooltip" style="display:none;"></div>

          <!-- Live during an active question (populated from the same SSE
               tool-call events as the chat's own trace); also replayable
               afterwards via play/step/reset, reusing the same
               build_graph_walk() steps that drive the auto highlight. -->
          <div class="reasoning-trace" id="reasoningTrace">
            <div class="log-head">
              <span class="dot"></span>Reasoning trace
              <div class="spacer"></div>
              <button class="log-btn" id="tracePlayBtn" type="button" aria-label="Play walk" data-tip="Play walk">▶</button>
              <button class="log-btn" id="traceStepBtn" type="button" aria-label="Next step" data-tip="Next step">⏭</button>
              <button class="log-btn" id="traceResetBtn" type="button" aria-label="Reset walk" data-tip="Reset walk">↺</button>
            </div>
            <div class="log-body" id="traceLogBody"></div>
          </div>

          <!-- Contextual key: only the record types actually present in the
               current scoped subgraph are shown (see updateLegend()), so this
               stays a 3-4 item key rather than a static 9-item bar. Hidden
               entirely on the Ontology Overview, where every node already
               carries its type name as a caption. -->
          <div class="graph-legend" id="graphLegend">
            <span class="legend-item" data-labels="Asset"><i class="legend-swatch" style="background:#f9c74f"></i>Asset</span>
            <span class="legend-item" data-labels="AlarmEvent,AlarmConfig"><i class="legend-swatch" style="background:#f94144"></i>Alarm</span>
            <span class="legend-item" data-labels="WorkOrder"><i class="legend-swatch" style="background:#577590"></i>Work Order</span>
            <span class="legend-item" data-labels="OperatorAction"><i class="legend-swatch" style="background:#f8961e"></i>Operator Action</span>
            <span class="legend-item" data-labels="HealthEvent"><i class="legend-swatch" style="background:#9b5de5"></i>Health Event</span>
            <span class="legend-item" data-labels="CostPosting"><i class="legend-swatch" style="background:#43aa8b"></i>Cost Posting</span>
            <span class="legend-item" data-labels="HistorianTag"><i class="legend-swatch" style="background:#adb5bd"></i>Historian Tag</span>
            <span class="legend-item" data-always="1"><i class="legend-line" style="background:var(--accent-blue)"></i>examining now</span>
            <span class="legend-item" data-always="1"><i class="legend-line" style="background:var(--accent-red)"></i>cited in answer</span>
          </div>

          <div class="inspector" id="inspector"></div>
        </div>
      </aside>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
